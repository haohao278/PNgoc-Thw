<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="blush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2314"/>
      <stop offset="100%" stop-color="#211107"/>
    </linearGradient>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8fa3"/>
      <stop offset="100%" stop-color="#ff4d6d"/>
    </linearGradient>
  </defs>

  <!-- Hair Back -->
  <path d="M 60 170 C 40 250, 40 320, 70 340 C 90 290, 80 220, 85 190 Z" fill="url(#hairGrad)" />
  <path d="M 240 170 C 260 250, 260 320, 230 340 C 210 290, 220 220, 215 190 Z" fill="url(#hairGrad)" />

  <!-- Body / Dress -->
  <path d="M 115 250 L 80 360 C 120 375, 180 375, 220 360 L 185 250 Z" fill="url(#dressGrad)" />
  <path d="M 125 240 C 140 260, 160 260, 175 240 Z" fill="#ffffff" />
  
  <!-- Tiny Hands holding a heart -->
  <ellipse cx="120" cy="285" rx="14" ry="12" fill="#ffe0bd" />
  <ellipse cx="180" cy="285" rx="14" ry="12" fill="#ffe0bd" />
  <!-- Heart held in hands -->
  <path d="M 150 292 C 150 292, 132 275, 132 265 C 132 255, 142 250, 150 258 C 158 250, 168 255, 168 265 C 168 275, 150 292, 150 292 Z" fill="#ff0054" />

  <!-- Legs -->
  <rect x="125" y="360" width="16" height="25" rx="8" fill="#ffe0bd" />
  <rect x="159" y="360" width="16" height="25" rx="8" fill="#ffe0bd" />
  <ellipse cx="133" cy="385" rx="12" ry="7" fill="#4a3e3d" />
  <ellipse cx="167" cy="385" rx="12" ry="7" fill="#4a3e3d" />

  <!-- Head / Face -->
  <ellipse cx="150" cy="165" rx="72" ry="65" fill="#ffe5cb" />

  <!-- Blushing Cheeks -->
  <ellipse cx="102" cy="180" rx="14" ry="8" fill="url(#blush)" />
  <ellipse cx="198" cy="180" rx="14" ry="8" fill="url(#blush)" />

  <!-- Big Sparkly Eyes -->
  <g id="eyes">
    <!-- Left Eye -->
    <ellipse cx="115" cy="160" rx="13" ry="16" fill="#2d1e18" />
    <circle cx="111" cy="154" r="5" fill="#ffffff" />
    <circle cx="118" cy="166" r="2.5" fill="#ffffff" />
    
    <!-- Right Eye -->
    <ellipse cx="185" cy="160" rx="13" ry="16" fill="#2d1e18" />
    <circle cx="181" cy="154" r="5" fill="#ffffff" />
    <circle cx="188" cy="166" r="2.5" fill="#ffffff" />

    <!-- Cute Eyelashes -->
    <path d="M 102 148 Q 115 142 128 147" stroke="#2d1e18" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 172 147 Q 185 142 198 148" stroke="#2d1e18" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Cute Smile -->
  <path d="M 142 182 Q 150 190 158 182" stroke="#d64045" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Front Hair & Bangs -->
  <path d="M 80 150 C 75 90, 225 90, 220 150 C 205 125, 180 145, 150 130 C 120 145, 95 125, 80 150 Z" fill="url(#hairGrad)" />
  <path d="M 75 145 C 65 175, 78 220, 85 230 C 92 200, 88 160, 92 145 Z" fill="url(#hairGrad)" />
  <path d="M 225 145 C 235 175, 222 220, 215 230 C 208 200, 212 160, 208 145 Z" fill="url(#hairGrad)" />

  <!-- Hair Ribbon / Clip -->
  <g transform="translate(190, 105) rotate(15)">
    <polygon points="0,0 -15,-10 -15,10" fill="#ff4d6d" />
    <polygon points="0,0 15,-10 15,10" fill="#ff4d6d" />
    <circle cx="0" cy="0" r="5" fill="#ffd166" />
  </g>
</svg>
