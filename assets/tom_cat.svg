<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360">
  <defs>
    <!-- Fur Gradients -->
    <linearGradient id="tomFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95a5b5"/>
      <stop offset="45%" stop-color="#7b8c9d"/>
      <stop offset="100%" stop-color="#5a6877"/>
    </linearGradient>
    <linearGradient id="tomBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f3f6"/>
    </linearGradient>
    <linearGradient id="tomEarPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c1"/>
      <stop offset="100%" stop-color="#ff758f"/>
    </linearGradient>
    <radialGradient id="tomEyeGlow" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#99e2b4"/>
      <stop offset="60%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </radialGradient>
    <linearGradient id="goldCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#ffe699"/>
      <stop offset="100%" stop-color="#e09f3e"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="softShade" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3d4956" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- TAIL (animated via CSS/JS) -->
  <g id="tom-tail" class="tail-anim">
    <!-- Smooth curved fluffy tail -->
    <path d="M 90 280 C 45 285, 20 250, 35 210 C 42 190, 65 195, 60 215 C 50 240, 70 260, 105 265 Z" fill="url(#tomFur)" filter="url(#softShade)"/>
    <!-- Tail tip lighter -->
    <path d="M 35 210 C 37 200, 50 195, 60 215 C 55 225, 42 225, 35 210 Z" fill="#e8edf2"/>
  </g>

  <!-- BODY -->
  <g id="tom-body">
    <!-- Main Chubby Body -->
    <ellipse cx="160" cy="240" rx="72" ry="62" fill="url(#tomFur)" filter="url(#softShade)"/>
    <!-- White fluffy chest / belly -->
    <path d="M 130 195 C 130 195, 120 270, 160 285 C 200 270, 190 195, 190 195 C 175 210, 145 210, 130 195 Z" fill="url(#tomBelly)"/>
    
    <!-- Left Paw -->
    <ellipse cx="132" cy="285" rx="20" ry="14" fill="#ffffff" filter="url(#softShade)"/>
    <path d="M 126 288 L 126 295 M 138 288 L 138 295" stroke="#d0d7de" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Paw -->
    <ellipse cx="188" cy="285" rx="20" ry="14" fill="#ffffff" filter="url(#softShade)"/>
    <path d="M 182 288 L 182 295 M 194 288 L 194 295" stroke="#d0d7de" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- HEAD -->
  <g id="tom-head">
    <!-- Left Ear (animated) -->
    <g class="ear-left-anim">
      <polygon points="105,120 85,45 142,95" fill="url(#tomFur)" filter="url(#softShade)"/>
      <polygon points="105,115 92,60 135,98" fill="url(#tomEarPink)"/>
      <path d="M 98 105 Q 115 100 125 108" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Right Ear (animated) -->
    <g class="ear-right-anim">
      <polygon points="215,120 235,45 178,95" fill="url(#tomFur)" filter="url(#softShade)"/>
      <polygon points="215,115 228,60 185,98" fill="url(#tomEarPink)"/>
      <path d="M 222 105 Q 205 100 195 108" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Chubby Head Base -->
    <ellipse cx="160" cy="145" rx="78" ry="65" fill="url(#tomFur)" filter="url(#softShade)"/>

    <!-- White muzzle & cheeks -->
    <path d="M 115 155 C 110 178, 140 188, 160 175 C 180 188, 210 178, 205 155 C 205 142, 115 142, 115 155 Z" fill="#ffffff"/>

    <!-- Cheeks Blushing -->
    <ellipse cx="106" cy="155" rx="14" ry="7" fill="#ff758f" opacity="0.45"/>
    <ellipse cx="214" cy="155" rx="14" ry="7" fill="#ff758f" opacity="0.45"/>

    <!-- EYES (with blinking animation) -->
    <g id="tom-eyes" class="eyes-anim">
      <!-- Left Eye -->
      <ellipse cx="128" cy="132" rx="16" ry="20" fill="url(#tomEyeGlow)"/>
      <ellipse cx="128" cy="132" rx="7" ry="18" fill="#1b263b"/>
      <!-- Highlights -->
      <circle cx="123" cy="124" r="6" fill="#ffffff"/>
      <circle cx="132" cy="140" r="2.5" fill="#ffffff"/>

      <!-- Right Eye -->
      <ellipse cx="192" cy="132" rx="16" ry="20" fill="url(#tomEyeGlow)"/>
      <ellipse cx="192" cy="132" rx="7" ry="18" fill="#1b263b"/>
      <!-- Highlights -->
      <circle cx="187" cy="124" r="6" fill="#ffffff"/>
      <circle cx="196" cy="140" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Tiny Pink Nose -->
    <path d="M 155 156 Q 160 152 165 156 Q 160 162 155 156 Z" fill="#ff758f"/>

    <!-- Sweet Cat Mouth -->
    <path d="M 160 160 L 160 166 M 160 166 Q 152 173 145 167 M 160 166 Q 168 173 175 167" stroke="#5a6877" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Whiskers -->
    <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <!-- Left Whiskers -->
      <line x1="125" y1="162" x2="85" y2="158"/>
      <line x1="124" y1="168" x2="88" y2="173"/>
      <!-- Right Whiskers -->
      <line x1="195" y1="162" x2="235" y2="158"/>
      <line x1="196" y1="168" x2="232" y2="173"/>
    </g>

    <!-- Collar & Tom Heart Name Tag -->
    <g id="tom-collar">
      <!-- Golden collar -->
      <path d="M 125 194 Q 160 206 195 194" stroke="url(#goldCollar)" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#softShade)"/>
      <!-- Heart Medal with "Tom" -->
      <g transform="translate(160, 208)">
        <path d="M 0 5 C 0 5 -12 -8 -12 -16 C -12 -23 -5 -27 2 -21 C 9 -27 16 -23 16 -16 C 16 -8 0 5 0 5 Z" fill="#ff4d6d" stroke="#ffe5ec" stroke-width="1.5" transform="scale(0.8) translate(-2, -5)"/>
        <text x="0" y="-10" font-family="'Comfortaa', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">Tom</text>
      </g>
    </g>
  </g>
</svg>
